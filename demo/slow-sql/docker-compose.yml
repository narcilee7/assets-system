services:
  mysql:
    image: mysql:8.0
    container_name: slowsql-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: slowsql
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: slowsql-redis
    ports:
      - "6379:6379"

volumes:
  mysql_data:
